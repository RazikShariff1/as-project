services:
  - type: web
    name: platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render's free instances spin down after 15 minutes idle; an UptimeRobot monitor on this path keeps it awake.
    healthCheckPath: /.well-known/alive
    envVars:
      - key: GOFR_ENV
        value: production
      # Render's proxy sets X-Forwarded-For, so the gateway can rate-limit logins per real client IP.
      - key: TRUST_FORWARDED_FOR
        value: "true"
      # One database per service (e.g. three databases in one Neon project). Fill in on the Render dashboard.
      - { key: ACCOUNT_DB_NAME,       value: neondb }
      - { key: ACCOUNT_DB_HOST,       sync: false }
      - { key: ACCOUNT_DB_USER,       sync: false }
      - { key: ACCOUNT_DB_PASSWORD,   sync: false }
      - { key: CATALOGUE_DB_NAME,       value: neondb }
      - { key: CATALOGUE_DB_HOST,     sync: false }
      - { key: CATALOGUE_DB_USER,     sync: false }
      - { key: CATALOGUE_DB_PASSWORD, sync: false }
      - { key: INVENTORY_DB_NAME,       value: neondb }
      - { key: ORDER_DB_NAME,           value: neondb }
      - { key: INVENTORY_DB_HOST,     sync: false }
      - { key: INVENTORY_DB_USER,     sync: false }
      - { key: INVENTORY_DB_PASSWORD, sync: false }
      - { key: ORDER_DB_HOST,           sync: false }
      - { key: ORDER_DB_USER,           sync: false }
      - { key: ORDER_DB_PASSWORD,       sync: false }
      - { key: CUSTOMER_DB_NAME,        value: neondb }
      - { key: CUSTOMER_DB_HOST,        sync: false }
      - { key: CUSTOMER_DB_USER,        sync: false }
      - { key: CUSTOMER_DB_PASSWORD,    sync: false }
      - { key: COMMUNICATION_DB_NAME,     value: neondb }
      - { key: COMMUNICATION_DB_HOST,     sync: false }
      - { key: COMMUNICATION_DB_USER,     sync: false }
      - { key: COMMUNICATION_DB_PASSWORD, sync: false }
      # Outgoing mail for communication-svc. Render's free plan blocks SMTP ports, so use the Gmail API (HTTPS). The first
      # configured of Gmail, then SMTP, is used; with neither, emails are only logged, not delivered.
      - { key: GMAIL_CLIENT_ID,     sync: false }
      - { key: GMAIL_CLIENT_SECRET, sync: false }
      - { key: GMAIL_REFRESH_TOKEN, sync: false }
      - { key: GMAIL_FROM,          sync: false }
      - { key: MAIL_FROM_NAME,      sync: false }
      # The order emails: shown in the subject and greeting (defaults Zopping and the rupee sign), plus an optional support address.
      - { key: STORE_NAME,      value: Zopping }
      - { key: CURRENCY_SYMBOL, value: "₹" }
      - { key: SUPPORT_EMAIL,   sync: false }
      # "Continue with Google" on the sign-in page. The OAuth client ID (public; no client secret is needed) of the Web
      # application client whose authorised JavaScript origins include the admin's URL. Unset, /auth/google answers 503.
      - { key: GOOGLE_CLIENT_ID,      sync: false }
      # account-svc creates this first admin on startup while there are no users.
      - { key: ADMIN_EMAIL,           sync: false }
      - { key: ADMIN_PASSWORD,        sync: false }
      # No Pub/Sub: catalogue-svc applies approvals to inventory-svc in-process.
      - { key: SELLER_CHANGE_DELIVERY,   value: direct }
